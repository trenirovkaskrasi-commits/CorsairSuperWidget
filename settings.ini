; ====================================================================
;  settings.ini for CorsairSuperWidget.ahk
;  Put it in the same folder as the script. After editing:
;  right-click the tray icon -> Reload script.
;  If a line is missing or wrong, the built-in value is used.
;  Comments: lines starting with a semicolon or a hash sign
; ====================================================================

[General]
; Design:
;   classic = clock and forecast on the left, 2 rows of icons on the right
;   wide    = top row for time, date and 6-day forecast, the 10 icons in one row below
Design=classic
; Language: auto (follows Windows) or bg, ru, en, fr, es, it, pt
Language=auto
; 1 = finds the smallest monitor automatically, 0 = uses ManualX/ManualY
AutoDetectScreen=1
ManualX=451
ManualY=1440

[Paths]
; Launcher icons folder (absolute path or relative to the script folder)
LauncherIcons=icons
; Weather icons folder (07.png, 01.png ...)
WeatherIcons=icons
; Folder with Chrome app (PWA) shortcuts, may contain %AppData%. Empty = default for the selected language
ChromeApps=

[Weather]
; City label under the temperature. Empty = Sofia (in the selected language)
City=
Lat=42.6977
Lon=23.3219
; refresh interval in minutes
RefreshMinutes=30

[Bar]
; Which two drives the bottom bar shows
Drive1=C:
Drive2=D:
; 1 = skips HWiNFO labels for power, load, clock, fan when reading temperatures
StrictTempLabels=1

[Volume]
; percent per wheel step over the VOL tile
WheelStep=5

[Launcher]
; Format:  AppN = icon name | what to launch | pwa (1/0) | word from the window title
; {ChromeApps} is replaced with the ChromeApps folder above. You can use %LocalAppData%, %ProgramFiles% and so on.
App1=Firefox.png | C:\Program Files\Mozilla Firefox\firefox.exe | 0 | Firefox
App2=Gemini.png | shell:AppsFolder\com.google.gemini.windows | 0 | Gemini
App3=YouTubeMusic.png | {ChromeApps}YouTube Music.lnk | 1 | YouTube Music
App4=Stremio.png | %LocalAppData%\Programs\Stremio\stremio-shell-ng.exe | 0 | Stremio
App5=UniversalRadio.png | shell:AppsFolder\52267melz.01.UniversalInternetRadio_0ekv48gcjdhv6!App | 0 | Radio
App6=Telegram.png | shell:AppsFolder\TelegramMessengerLLP.TelegramDesktop_t4vj0pshhgkwm!Telegram.TelegramDesktop.Store | 0 | Telegram
App7=Viber.png | %LocalAppData%\Viber\Viber.exe | 0 | Viber
App8=instagram.png | {ChromeApps}Instagram.lnk | 1 | Instagram
App9=Pinterest.png | {ChromeApps}Pinterest.lnk | 1 | Pinterest
App10=YouTube.png | {ChromeApps}YouTube.lnk | 1 | YouTube
