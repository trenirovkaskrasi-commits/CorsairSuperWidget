; ====================================================================
;  settings.ini за CorsairSuperWidget.ahk
;  Слага се в същата папка като скрипта. След промяна:
;  десен клик на иконата в трея -> "Презареди скрипта".
;  Ако ред липсва или е грешен, скриптът ползва вградената стойност.
;  Коментари: редове, започващи с ; или #
; ====================================================================

[General]
; Дизайн:
;   classic = сегашният (час и прогноза вляво, 2 реда икони вдясно)
;   wide    = целият горен ред за часа, датата, времето и 5-дневната прогноза,
;             под него 10-те икони в един ред, най-долу лентата
Design=classic
; 1 = сам намира най-малкия монитор; 0 = ползва ManualX/ManualY
AutoDetectScreen=1
ManualX=451
ManualY=1440

[Paths]
; Папка с иконите на лаунчера (абсолютен път или спрямо папката на скрипта)
LauncherIcons=icons
; Папка с иконите за времето (07.png, 01.png ...)
WeatherIcons=icons
; Папка с преките пътища на Chrome приложенията (PWA); може да има %AppData% и др.
ChromeApps=%AppData%\Microsoft\Windows\Start Menu\Programs\Приложения в Chrome

[Weather]
City=София
Lat=42.6977
Lon=23.3219
; на колко минути се обновява прогнозата
RefreshMinutes=30

[Bar]
; Кои два диска да показва долната лента
Drive1=C:
Drive2=D:
; 1 = за температурите пропуска HWiNFO етикети за мощност, натоварване, честота, вентилатор
StrictTempLabels=1

[Volume]
; процента на една "крачка" на колелцето над плочката VOL
WheelStep=5

[Launcher]
; Формат:  AppN = име на иконата | какво да се стартира | pwa (1/0) | дума от заглавието на прозореца
; {ChromeApps} се заменя с папката ChromeApps отгоре; може да ползваш %LocalAppData%, %ProgramFiles% и др.
App1=Firefox.png | C:\Program Files\Mozilla Firefox\firefox.exe | 0 | Firefox
App2=Gemini.png | shell:AppsFolder\com.google.gemini.windows | 0 | Gemini
App3=YouTubeMusic.png | {ChromeApps}YouTube Music.lnk | 1 | YouTube Music
App4=Stremio.png | %LocalAppData%\Programs\Stremio\stremio-shell-ng.exe | 0 | Stremio
App5=UniversalRadio.png | shell:AppsFolder\52267melz.01.UniversalInternetRadio_0ekv48gcjdhv6!App | 0 | Radio
App6=Telegram.png | shell:AppsFolder\TelegramMessengerLLP.TelegramDesktop_t4vj0pshhgkwm!Telegram.TelegramDesktop.Store | 0 | Telegram
App7=Viber.png | %LocalAppData%\Viber\Viber.exe | 0 | Viber
App8=instagram.png | {ChromeApps}Instagram.lnk | 1 | Instagram
App9=Pinterest.png | {ChromeApps}Pinterest.lnk | 1 | Pinterest
App10=YouTube.png | {ChromeApps}YouTube.lnk | 1 | YouTube
